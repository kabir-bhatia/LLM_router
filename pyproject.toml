[project]
name = "smart-model-router"
version = "0.1.0"
description = "Cost-Control Smart Model Router - Intelligently routes prompts to the cheapest capable model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Smart Model Router Team" }]

dependencies = [
    # FastAPI & Web Server
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database (SQLite -- see src/config.py for why, vs. upstream's Postgres)
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "numpy>=2.1.3",

    # Redis Caching (optional at runtime -- see src/services/semantic_cache.py;
    # the client library is still a hard dependency so the degrade-gracefully
    # path has something to catch an exception from)
    "redis>=5.2.0",

    # LLM Providers -- Vertex AI (service account) and/or AI Studio (API key),
    # see src/providers/gemini.py
    "google-genai[aiohttp]>=1.0.0",
    "google-auth>=2.35.0",
    "httpx>=0.28.0",

    # Embeddings (local, no API key -- see src/services/embeddings.py)
    "sentence-transformers>=3.3.0",

    # Utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
eval = [
    # Only needed by eval/*.py (accuracy metrics, confusion-matrix plots) --
    # not required to run the FastAPI app itself.
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
